[package]
name = "sentinel-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "esnode-sentinel"
path = "src/main.rs"

[dependencies]
sentinel-core = { path = "../../crates/sentinel-core" }
sentinel-orchestrator = { path = "../../crates/sentinel-orchestrator" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
humantime = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
url = "2"
ratatui = { version = "0.26", default-features = false, features = ["crossterm"] }
crossterm = "0.27"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
toml = "0.8"
tokio = { version = "1.35", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
sentinel-skill-modbus = { version = "0.1.0", path = "../../skills/modbus" }
sentinel-skill-dnp3 = { version = "0.1.0", path = "../../skills/dnp3" }
sentinel-skill-snmp = { version = "0.1.0", path = "../../skills/snmp" }
sentinel-skill-mqtt = { version = "0.1.0", path = "../../skills/mqtt" }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[package.metadata.deb]
name = "esnode-sentinel"
maintainer = "Estimatedstocks AB <support@estimatedstocks.com>"
priority = "optional"
section = "utils"
revision = "1"
depends = ["libssl3 | libssl", "adduser"]
assets = [
    ["target/release/esnode-sentinel", "/usr/local/bin/esnode-sentinel", "755"],
    ["../../deploy/systemd/esnode-sentinel.service", "/etc/systemd/system/esnode-sentinel.service", "644"],
]
